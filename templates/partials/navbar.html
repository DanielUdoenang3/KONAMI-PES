<header class="sticky top-0 z-50 border-b border-white/10 bg-neutral-950/80 backdrop-blur">
  <nav class="mx-auto flex max-w-7xl items-center justify-between px-6 py-4">
    <a href="{% url 'landing' %}" class="flex items-center gap-2 text-lg font-bold tracking-tight text-white">
      <span class="inline-block h-2.5 w-2.5 rounded-full bg-emerald-400"></span>
      PES<span class="text-emerald-400">Arena</span>
    </a>
    <!-- Desktop menu -->
    <div class="hidden items-center gap-8 text-sm font-medium text-neutral-300 md:flex">
      <a href="#tournaments" class="hover:text-white transition">Tournaments</a>
      <a href="#news" class="hover:text-white transition">News</a>
      <a href="#" class="hover:text-white transition">Players</a>
    </div>
    
    <!-- Right-side actions -->
    <div class="flex items-center gap-3">
      <div class="hidden items-center gap-3 md:flex">
        {% if user.is_authenticated %}
          <span class="text-sm font-medium text-neutral-300">{{ user.first_name|default:user.email }}</span>
          <button type="button" onclick="document.getElementById('logout-modal').showModal()"
            class="rounded-full border border-white/15 px-4 py-2 text-sm font-semibold text-white hover:bg-white/5 transition">
          Log out
          </button>
        {% else %}
          <a href="{% url 'account_login' %}" class="text-sm font-medium text-neutral-300 hover:text-white">Log in</a>
          <a href="{% url 'account_signup' %}" class="rounded-full bg-emerald-500 px-4 py-2 text-sm font-semibold text-neutral-950 hover:bg-emerald-400 transition">Sign up</a>
        {% endif %}
      </div>

      <!-- Hamburger toggle for mobile -->
      <button id="mobile-menu-btn" type="button" class="rounded-lg p-2 text-neutral-400 hover:bg-white/5 hover:text-white md:hidden transition">
        <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
        </svg>
      </button>
    </div>
  </nav>

  <!-- Mobile menu dropdown -->
  <div id="mobile-menu" class="hidden border-t border-white/10 bg-neutral-950 px-6 py-4 md:hidden">
    <div class="flex flex-col gap-4 text-sm font-medium text-neutral-300">
      <a href="#tournaments" class="hover:text-white transition">Tournaments</a>
      <a href="#news" class="hover:text-white transition">News</a>
      <a href="#" class="hover:text-white transition">Players</a>
      <hr class="border-white/10 my-1">
      {% if user.is_authenticated %}
        <span class="text-sm text-neutral-400">{{ user.first_name|default:user.email }}</span>
        <button type="button" onclick="document.getElementById('logout-modal').showModal()"
          class="w-fit text-left text-red-400 hover:text-red-300 transition">
        Log out
        </button>
      {% else %}
        <a href="{% url 'account_login' %}" class="hover:text-white">Log in</a>
        <a href="{% url 'account_signup' %}" class="w-full text-center rounded-full bg-emerald-500 px-4 py-2 text-sm font-semibold text-neutral-950 hover:bg-emerald-400 transition">Sign up</a>
      {% endif %}
    </div>
  </div>
</header>

<script>
  document.getElementById('mobile-menu-btn').addEventListener('click', function() {
    const menu = document.getElementById('mobile-menu');
    menu.classList.toggle('hidden');
  });
</script>
