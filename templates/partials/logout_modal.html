<dialog id="logout-modal" class="fixed inset-0 m-auto h-fit w-[90%] max-w-sm rounded-2xl border border-white/10 bg-neutral-900 p-6 text-neutral-100 backdrop:bg-black/70 backdrop:backdrop-blur-sm">
  <h2 class="text-lg font-bold text-white">Sign out?</h2>
  <p class="mt-2 text-sm text-neutral-400">You'll need to log back in to comment, predict scores, and follow players.</p>
  <form method="post" action="{% url 'account_logout' %}" class="mt-6 flex justify-end gap-3">
    {% csrf_token %}
    <button type="button" onclick="document.getElementById('logout-modal').close()"
            class="rounded-full border border-white/15 px-5 py-2 text-sm font-semibold text-white hover:bg-white/5 transition">
      Cancel
    </button>
    <button type="submit"
            class="rounded-full bg-red-500 px-5 py-2 text-sm font-semibold text-white hover:bg-red-400 transition">
      Sign out
    </button>
  </form>
</dialog>
<script>
  document.getElementById('logout-modal').addEventListener('click', function (e) {
    if (e.target === this) this.close();   // click on the backdrop closes it
  });
</script>
