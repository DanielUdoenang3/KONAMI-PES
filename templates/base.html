{% load static %}
<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}PES Arena{% endblock %}</title>
  <meta name="description" content="{% block description %}Live tables, results and news for community PES tournaments.{% endblock %}">
  <link rel="stylesheet" href="{% static 'css/output.css' %}">
</head>
<body class="bg-neutral-950 text-neutral-100 font-sans antialiased">
  {% include "partials/navbar.html" %}
  <main>
    {% block content %}{% endblock %}
  </main>
  {% include "partials/footer.html" %}
  {% include "partials/logout_modal.html" %}
</body>
</html>
